<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Leo Card Motion</title>
  <link rel="stylesheet" href="/cards/static/styles.css?v=0.5.0"/>
</head>
<body>
  <div class="app">
    <aside class="rail" aria-label="navigation">
      <div class="brand">LC</div>
      <a class="nav active" href="/cards/"><span>▣</span>스튜디오</a>
      <a class="nav" href="/app/"><span>▶</span>Timeline</a>
      <a class="nav" href="/grok/"><span>◎</span>Grok</a>
    </aside>

    <div class="main">
      <header class="top">
        <div class="titleblock">
          <h1>Leo Card Motion</h1>
          <p>급상승 이슈 → 카드 슬라이드 → 영상</p>
        </div>
        <div class="top-actions" id="health">booting…</div>
      </header>

      <div class="workspace">
        <section class="col primary">
          <div class="panel">
            <div class="panel-head">
              <span class="kicker">Preview</span>
              <div class="controls">
                <select id="aspect">
                  <option value="9:16">9:16</option>
                  <option value="16:9">16:9</option>
                  <option value="1:1">1:1</option>
                </select>
                <select id="engine">
                  <option value="hyperframes" selected>Hyperframes</option>
                  <option value="auto">auto</option>
                  <option value="playwright">Playwright</option>
                  <option value="remotion">Remotion</option>
                </select>
                <button class="btn" id="btnRefresh" type="button">이슈 새로고침</button>
                <button class="btn primary" id="btnBuild" type="button">카드 생성</button>
                <button class="btn primary" id="btnRender" type="button">렌더</button>
                <button class="btn" id="btnPush" type="button">Timeline 전송</button>
              </div>
            </div>
            <div class="stage-frame">
              <div class="stage" id="stage"><div class="empty">카드를 생성하면 여기에 미리보기가 뜹니다</div></div>
            </div>
            <div class="status" id="projStatus">프로젝트 없음</div>
          </div>

          <div class="panel">
            <div class="kicker">트렌드 이슈</div>
            <div class="chips" id="catChips"></div>
            <div class="issue-list" id="issueList"></div>
            <div class="status" id="trendStatus"></div>
            <div class="ticker" id="ticker"></div>
          </div>

          <div class="panel">
            <div class="kicker">생성 옵션</div>
            <div class="options-grid">
              <div>
                <div class="label">카드 템플릿</div>
                <div class="chips" id="tplChips"></div>
              </div>
              <div>
                <div class="label">모션 (전환 스타일 · 미리보기/렌더 모두 적용)</div>
                <div class="chips" id="motionChips"></div>
              </div>
            </div>
          </div>
        </section>

        <section class="col side">
          <div class="panel sticky">
            <div class="kicker">슬라이드 보드</div>
            <div class="slides" id="slides"></div>
          </div>
          <div class="panel" id="editor">
            <div class="status">슬라이드를 선택하면 편집할 수 있습니다</div>
          </div>
        </section>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script>
    window.APP_BASE = "/cards";
  </script>
  <script src="/cards/static/app.js?v=0.5.0"></script>
</body>
</html>
