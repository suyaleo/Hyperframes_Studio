name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion-template/package-lock.json
      - name: Sync Python environment
        run: uv sync --locked
      - name: Install Remotion dependencies
        run: npm ci --prefix remotion-template --ignore-scripts --no-audit --no-fund
      - name: Lint Python
        run: uv run ruff check api tests
      - name: Test Python
        run: uv run pytest --cov=api --cov-report=term-missing
      - name: Type-check Remotion
        run: npm run typecheck --prefix remotion-template

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          build-args: |
            VERSION=0.1.0
            VCS_REF=${{ github.sha }}
