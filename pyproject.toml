[project]
name = "hyperframes-studio"
version = "0.1.0"
description = "Evidence-first AI studio for Hyperframes HTML cards and Remotion video"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115.0,<1",
  "feedparser>=6.0.11,<7",
  "httpx>=0.27.0,<1",
  "jinja2>=3.1.4,<4",
  "playwright==1.49.1",
  "pydantic>=2.0.0,<3",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.32.0,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
