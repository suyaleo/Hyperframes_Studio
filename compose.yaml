name: hyperframes-studio

services:
  app:
    build:
      context: .
      args:
        VERSION: 0.1.0
        VCS_REF: ${VCS_REF:-local}
    image: hyperframes-studio:local
    restart: unless-stopped
    shm_size: "1gb"
    env_file:
      - path: .env
        required: false
    environment:
      HYPERFRAMES_DATA_DIR: /data
      HYPERFRAMES_DEFAULT_ENGINE: ${HYPERFRAMES_DEFAULT_ENGINE:-hyperframes}
      OMLX_BASE_URL: ${OMLX_DOCKER_BASE_URL:-http://host.docker.internal:8000/v1}
      OMLX_API_KEY: ${OMLX_API_KEY:-}
      OMLX_MODEL: ${OMLX_MODEL:-}
      LT_TIMELINE_URL: ${LT_TIMELINE_URL:-}
      LT_TIMELINE_TOKEN: ${LT_TIMELINE_TOKEN:-}
      PRODUCER_LOW_MEMORY_MODE: ${PRODUCER_LOW_MEMORY_MODE:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HYPERFRAMES_STUDIO_PORT:-8770}:8770"
    volumes:
      - hyperframes-studio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8770/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  hyperframes-studio-data:
